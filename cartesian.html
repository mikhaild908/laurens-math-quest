<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Cartesian Coordinates</title>
  <style>
    :root {
      --ink: #243044;
      --navy: #263b63;
      --blue: #4b7bec;
      --yellow: #ffd166;
      --coral: #ff8066;
      --mint: #54d6b2;
      --paper: #fffdf7;
      --sky: #e8f4ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: var(--sky);
      display: flex;
      min-height: 100vh;
    }

    #nav {
      width: 200px;
      background: #2c3e50;
      color: white;
      min-height: 100vh;
      padding-top: 20px;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 2;
      box-shadow: 5px 0 0 rgba(36, 48, 68, 0.08);
    }

    #nav h2 {
      text-align: center;
      margin: 0 0 20px;
      color: var(--yellow);
      letter-spacing: 0.04em;
    }

    #nav a {
      display: block;
      padding: 12px 20px;
      color: white;
      text-decoration: none;
      font-size: 16px;
      transition: background 160ms ease, padding-left 160ms ease;
    }

    #nav a:hover,
    #nav a:focus-visible {
      background: #345184;
      padding-left: 26px;
      outline: none;
    }

    #container {
      width: calc(100% - 200px);
      margin-left: 200px;
      padding: 34px clamp(24px, 6vw, 84px) 56px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--blue);
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1;
    }

    .intro {
      max-width: 620px;
      margin: 16px auto 26px;
      font-size: 18px;
      line-height: 1.5;
    }

    .activity-card {
      max-width: 720px;
      margin: 0 auto;
      padding: clamp(20px, 4vw, 34px);
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 24px;
      box-shadow: 9px 9px 0 var(--coral);
    }

    .grid-wrap {
      overflow-x: auto;
      padding: 4px;
    }

    canvas {
      display: block;
      margin: 0 auto;
      border: 3px solid var(--ink);
      background: #ffffff;
      cursor: crosshair;
    }

    #info {
      margin-top: 22px;
      color: var(--navy);
      font-size: 20px;
      font-weight: bold;
    }

    #result {
      margin-top: 10px;
      min-height: 24px;
      font-weight: bold;
    }

    button {
      margin-top: 18px;
      padding: 11px 20px;
      color: var(--navy);
      background: var(--yellow);
      border: 2px solid var(--ink);
      border-radius: 999px;
      box-shadow: 3px 3px 0 var(--ink);
      font: inherit;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    button:hover,
    button:focus-visible {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--ink);
      outline: none;
    }

    @media (max-width: 700px) {
      body {
        display: block;
      }

      #nav {
        width: 100%;
        min-height: auto;
        position: static;
        padding: 12px 10px;
      }

      #nav h2 {
        margin: 0 0 8px;
      }

      #nav a {
        display: inline-block;
        padding: 9px 10px;
        font-size: 14px;
      }

      #nav a:hover,
      #nav a:focus-visible {
        padding-left: 10px;
      }

      #container {
        width: 100%;
        margin-left: 0;
        padding: 28px 16px 42px;
      }

      .activity-card {
        padding: 18px 10px 24px;
      }
    }
  </style>
</head>
<body>
  <div id="nav">
    <h2>Math Club</h2>
    <a href="index.html">Home</a>
    <a href="cartesian.html">Cartesian Catcher</a>
    <a href="polygon-builder.html">Polygon Builder</a>
    <a href="#">About</a>
  </div>

  <main id="container">
    <p class="eyebrow">Mission 01 | Coordinate Club</p>
    <h1>Cartesian Coordinates Practice</h1>
    <p class="intro">Use your x and y skills to catch the hidden point. Click the grid where you think it belongs.</p>

    <section class="activity-card" aria-label="Cartesian coordinate activity">
      <div class="grid-wrap">
        <canvas id="grid" width="500" height="500"></canvas>
      </div>
      <div id="info"></div>
      <div id="result" aria-live="polite"></div>
      <button id="newPointBtn">New Point</button>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('grid');
    const ctx = canvas.getContext('2d');
    const info = document.getElementById('info');
    const result = document.getElementById('result');
    const newPointBtn = document.getElementById('newPointBtn');

    // Grid settings
    const size = 500;
    const units = 10; // -10 to +10
    const step = size / (units * 2); // pixels per unit
    const originX = size / 2;
    const originY = size / 2;

    let targetX = 0;
    let targetY = 0;

    function drawGrid() {
  ctx.clearRect(0, 0, size, size);

  // Draw grid lines
  ctx.strokeStyle = '#ddd';
  ctx.lineWidth = 1;

  ctx.font = '14px Arial';
  ctx.fillStyle = '#000';

  for (let i = -units; i <= units; i++) {
    const x = originX + i * step;
    const y = originY - i * step;

    // Vertical lines
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, size);
    ctx.stroke();

    // Horizontal lines
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(size, y);
    ctx.stroke();

    // Number labels (skip 0 on axes to avoid clutter)
    if (i !== 0) {
      // x-axis numbers
      ctx.fillText(i, x - 5, originY + 15);

      // y-axis numbers
      ctx.fillText(i, originX + 8, y + 5);
    }
  }

  // Axes
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;

  // x-axis
  ctx.beginPath();
  ctx.moveTo(0, originY);
  ctx.lineTo(size, originY);
  ctx.stroke();

  // y-axis
  ctx.beginPath();
  ctx.moveTo(originX, 0);
  ctx.lineTo(originX, size);
  ctx.stroke();

  // Origin label
  ctx.fillText('(0,0)', originX + 5, originY - 5);
}

    function randomPoint() {
      // Random integer between -10 and 10
      targetX = Math.floor(Math.random() * 21) - 10;
      targetY = Math.floor(Math.random() * 21) - 10;
      info.textContent = `Find the point: (${targetX}, ${targetY})`;
      result.textContent = '';
      drawGrid();
    }

    function canvasToCoords(px, py) {
      // Convert pixel to coordinate
      const x = Math.round((px - originX) / step);
      const y = Math.round((originY - py) / step);
      return { x, y };
    }

    function drawClickPoint(x, y, color) {
      const px = originX + x * step;
      const py = originY - y * step;

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(px, py, 6, 0, Math.PI * 2);
      ctx.fill();
    }

    canvas.addEventListener('click', (event) => {
      const rect = canvas.getBoundingClientRect();
      const px = event.clientX - rect.left;
      const py = event.clientY - rect.top;

      const { x, y } = canvasToCoords(px, py);

      drawGrid();
      // Draw target point (for feedback)
      drawClickPoint(targetX, targetY, 'green');
      // Draw student click
      drawClickPoint(x, y, 'red');

      if (x === targetX && y === targetY) {
        result.textContent = `Great job! You clicked exactly on (${x}, ${y}).`;
      } else {
        result.textContent = `Nice try! You clicked (${x}, ${y}). The correct point is (${targetX}, ${targetY}).`;
      }
    });

    newPointBtn.addEventListener('click', randomPoint);

    // Initialize
    drawGrid();
    randomPoint();
  </script>
</body>
</html>
