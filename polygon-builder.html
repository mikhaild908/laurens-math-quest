<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polygon Builder</title>
<style>
  :root {
    --ink: #243044;
    --navy: #263b63;
    --blue: #4b7bec;
    --yellow: #ffd166;
    --coral: #ff8066;
    --mint: #54d6b2;
    --paper: #fffdf7;
    --sky: #e8f4ff;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    color: var(--ink);
    font-family: "Trebuchet MS", Arial, sans-serif;
    background: var(--sky);
    display: flex;
    min-height: 100vh;
  }

  #nav {
    width: 200px;
    background: var(--navy);
    color: white;
    min-height: 100vh;
    padding-top: 20px;
    position: fixed;
    left: 0;
    top: 0;
    z-index: 2;
    box-shadow: 5px 0 0 rgba(36, 48, 68, 0.08);
  }

  #nav h2 {
    text-align: center;
    margin: 0 0 20px;
    color: var(--yellow);
    letter-spacing: 0.04em;
  }

  #nav a {
    display: block;
    padding: 12px 20px;
    color: white;
    text-decoration: none;
    font-size: 16px;
    transition: background 160ms ease, padding-left 160ms ease;
  }

  #nav a:hover,
  #nav a:focus-visible {
    background: #345184;
    padding-left: 26px;
    outline: none;
  }

  #container {
    width: calc(100% - 200px);
    margin-left: 200px;
    padding: 34px clamp(24px, 6vw, 84px) 56px;
    text-align: center;
  }

  .eyebrow {
    margin: 0 0 10px;
    color: var(--blue);
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    color: var(--navy);
    font-size: clamp(34px, 5vw, 58px);
    line-height: 1;
  }

  .intro {
    max-width: 620px;
    margin: 16px auto 26px;
    font-size: 18px;
    line-height: 1.5;
  }

  .builder-card {
    max-width: 820px;
    margin: 0 auto;
    padding: clamp(20px, 4vw, 34px);
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 24px;
    box-shadow: 9px 9px 0 var(--mint);
  }

  .setup-row,
  #coordInput {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 22px;
  }

  #coordInput {
    display: none;
  }

  .points-panel {
    max-width: 500px;
    margin: 0 auto 24px;
    padding: 16px;
    text-align: left;
    background: #e8f4ff;
    border: 2px solid var(--blue);
    border-radius: 16px;
  }

  .points-panel h2 {
    margin: 0 0 8px;
    color: var(--navy);
    font-size: 20px;
  }

  #pointList {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 8px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  #pointList li {
    padding: 8px 10px;
    background: white;
    border: 2px solid var(--ink);
    border-radius: 10px;
    font-weight: bold;
  }

  #emptyPoints {
    margin: 0;
    color: var(--blue);
    font-size: 14px;
  }

  .reset-button {
    margin-top: 24px;
    background: var(--coral);
  }

  label,
  #coordPrompt {
    font-size: 18px;
    font-weight: bold;
  }

  canvas {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 0 auto;
    border: 3px solid var(--ink);
    background: #fff;
  }

  input {
    width: 80px;
    padding: 10px;
    color: var(--ink);
    background: white;
    border: 2px solid var(--ink);
    border-radius: 10px;
    font: inherit;
    font-size: 16px;
  }

  button {
    padding: 11px 20px;
    color: var(--navy);
    background: var(--yellow);
    border: 2px solid var(--ink);
    border-radius: 999px;
    box-shadow: 3px 3px 0 var(--ink);
    font: inherit;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 160ms ease, box-shadow 160ms ease;
  }

  button:hover,
  button:focus-visible {
    transform: translate(-2px, -2px);
    box-shadow: 5px 5px 0 var(--ink);
    outline: none;
  }

  @media (max-width: 700px) {
    body {
      display: block;
    }

    #nav {
      width: 100%;
      min-height: auto;
      position: static;
      padding: 12px 10px;
    }

    #nav h2 {
      margin: 0 0 8px;
    }

    #nav a {
      display: inline-block;
      padding: 9px 10px;
      font-size: 14px;
    }

    #nav a:hover,
    #nav a:focus-visible {
      padding-left: 10px;
    }

    #container {
      width: 100%;
      margin-left: 0;
      padding: 28px 16px 42px;
    }

    .builder-card {
      padding: 18px 10px 24px;
    }
  }
</style>
</head>
<body>

<nav id="nav" aria-label="Main navigation">
  <h2>Math Club</h2>
  <a href="index.html">Home</a>
  <a href="cartesian.html">Ordered Pair Catcher</a>
  <a href="polygon-builder.html" aria-current="page">Polygon Builder</a>
  <a href="#">About</a>
</nav>

<main id="container">
  <p class="eyebrow">Mission 02 | Coordinate Club</p>
  <h1>Polygon on the Coordinate Plane</h1>
  <p class="intro">Build a shape one point at a time, then watch your coordinates connect into a polygon.</p>

  <section class="builder-card" aria-label="Polygon building activity">
    <div class="setup-row">
      <label for="pointCount">How many points does your polygon have?</label>
      <input type="number" id="pointCount" min="3" max="20">
    <button id="startBtn">Start</button>
    </div>

  <div id="coordInput">
    <div id="coordPrompt"></div>
    <input type="number" id="xInput" placeholder="x">
    <input type="number" id="yInput" placeholder="y">
    <button id="addPointBtn">Add Point</button>
  </div>

  <section class="points-panel" aria-labelledby="pointsHeading">
    <h2 id="pointsHeading">Points in your polygon</h2>
    <p id="emptyPoints">No points yet. Start a polygon to begin.</p>
    <ol id="pointList"></ol>
  </section>

  <canvas id="grid" width="500" height="500"></canvas>
  <button id="resetBtn" class="reset-button" type="button">Start New Polygon</button>
  </section>
</main>


<script>
const canvas = document.getElementById('grid');
const ctx = canvas.getContext('2d');

const startBtn = document.getElementById('startBtn');
const pointCountInput = document.getElementById('pointCount');
const coordInput = document.getElementById('coordInput');
const coordPrompt = document.getElementById('coordPrompt');
const addPointBtn = document.getElementById('addPointBtn');
const xInput = document.getElementById('xInput');
const yInput = document.getElementById('yInput');
const pointList = document.getElementById('pointList');
const emptyPoints = document.getElementById('emptyPoints');
const resetBtn = document.getElementById('resetBtn');

const size = 500;
const units = 10;
const step = size / (units * 2);
const originX = size / 2;
const originY = size / 2;

let totalPoints = 0;
let points = [];
let currentPointIndex = 0;
let animationRun = 0;

function renderPointList() {
  pointList.replaceChildren();
  emptyPoints.hidden = points.length > 0;

  points.forEach((point, index) => {
    const item = document.createElement('li');
    item.textContent = `Point ${index + 1}: (${point.x}, ${point.y})`;
    pointList.appendChild(item);
  });
}

function drawGrid() {
  ctx.clearRect(0, 0, size, size);

  ctx.strokeStyle = '#ddd';
  ctx.lineWidth = 1;
  ctx.font = '12px Arial';
  ctx.fillStyle = '#000';

  for (let i = -units; i <= units; i++) {
    const x = originX + i * step;
    const y = originY - i * step;

    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, size);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(size, y);
    ctx.stroke();

    if (i !== 0) {
      ctx.fillText(i, x - 5, originY + 15);
      ctx.fillText(i, originX + 8, y + 5);
    }
  }

  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;

  ctx.beginPath();
  ctx.moveTo(0, originY);
  ctx.lineTo(size, originY);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(originX, 0);
  ctx.lineTo(originX, size);
  ctx.stroke();

  ctx.fillText("(0,0)", originX + 5, originY - 5);
}

function toPixel(x, y) {
  return {
    px: originX + x * step,
    py: originY - y * step
  };
}

function animatePolygon() {
  const currentAnimationRun = ++animationRun;
  drawGrid();

  ctx.strokeStyle = "blue";
  ctx.lineWidth = 3;

  let i = 0;

  function drawStep() {
    if (currentAnimationRun !== animationRun) {
      return;
    }

    if (i >= points.length) {
      const { px, py } = toPixel(points[0].x, points[0].y);
      ctx.lineTo(px, py);
      ctx.stroke();
      return;
    }

    const { px, py } = toPixel(points[i].x, points[i].y);

    if (i === 0) {
      ctx.beginPath();
      ctx.moveTo(px, py);
    } else {
      ctx.lineTo(px, py);
      ctx.stroke();
    }

    i++;
    setTimeout(drawStep, 600);
  }

  drawStep();
}

startBtn.addEventListener('click', () => {
  totalPoints = parseInt(pointCountInput.value);

  if (isNaN(totalPoints) || totalPoints < 3) {
    alert("Please enter a number 3 or greater.");
    return;
  }

  points = [];
  currentPointIndex = 0;
  animationRun++;
  renderPointList();
  drawGrid();

  coordInput.style.display = "block";
  coordPrompt.textContent = `Enter point #1 (x, y):`;
});

addPointBtn.addEventListener('click', () => {
  const x = parseFloat(xInput.value);
  const y = parseFloat(yInput.value);

  if (isNaN(x) || isNaN(y)) {
    alert("Please enter valid numbers.");
    return;
  }

  points.push({ x, y });
  currentPointIndex++;
  renderPointList();

  xInput.value = "";
  yInput.value = "";

  if (currentPointIndex < totalPoints) {
    coordPrompt.textContent = `Enter point #${currentPointIndex + 1} (x, y):`;
  } else {
    coordInput.style.display = "none";
    animatePolygon();
  }
});

resetBtn.addEventListener('click', () => {
  animationRun++;
  totalPoints = 0;
  points = [];
  currentPointIndex = 0;
  pointCountInput.value = "";
  xInput.value = "";
  yInput.value = "";
  coordPrompt.textContent = "";
  coordInput.style.display = "none";
  renderPointList();
  drawGrid();
});

drawGrid();
renderPointList();
</script>

</body>
</html>
